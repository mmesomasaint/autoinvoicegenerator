[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Automatically handle async test functions marked with @pytest.mark.asyncio
asyncio_mode = auto

# Output formatting & logging
addopts = 
    --strict-markers
    --disable-warnings
    -v

markers =
    unit: Fast unit tests that require no database IO
    integration: Integration tests requiring async database session fixtures
